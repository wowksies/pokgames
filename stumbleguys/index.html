        var reader = cs.readable.getReader();
        function pump() {
          reader.read().then(function(r) {
            if(r.done) {
              var total = chunks.reduce(function(a,c){return a+c.length;},0);
              var out = new Uint8Array(total);
              var off = 0;
              chunks.forEach(function(c){out.set(c,off);off+=c.length;});
              resolve(out.buffer);
            } else { chunks.push(r.value); pump(); }
          }).catch(reject);
        }
        pump();
      } catch(e) { reject(e); }
    });
  }
  var _fetch = window.fetch;
  window.fetch = function(input, init){
    var url = (typeof input==="string") ? input : ((input && input.url) || "");
    var m = find(url);
    if(m !== null){
      var reqHdrs = (init && init.headers) || {};
      var wantsGzip = false;
      try {
        if(typeof reqHdrs.get==="function") wantsGzip = reqHdrs.get("use_response_compression")==="true";
        else wantsGzip = reqHdrs["use_response_compression"]==="true";
      } catch(e){}
      if(url.indexOf("login")!==-1 && url.indexOf("v2")!==-1){
        console.log("[SG] login/v2 compression:", wantsGzip);
      }
      console.log("[Mock]", url.substring(0,80));
      var body = m||"{}";
      if(wantsGzip) {
        return _sgGzip(body).then(function(compressed) {
          console.log("[SG] Returning gzip response, bytes:", compressed.byteLength);
          return new Response(compressed, {status:200, headers:{"Content-Type":"application/json","Access-Control-Allow-Origin":"*"}});
        }).catch(function(e) {
          console.warn("[SG] gzip failed, plain fallback:", e);
          return new Response(body, {status:200, headers:{"Content-Type":"application/json","Access-Control-Allow-Origin":"*"}});
        });
      }
      return Promise.resolve(new Response(body, {status:200, headers:{"Content-Type":"application/json","Access-Control-Allow-Origin":"*"}}));
    }
    // Route unhandled api.stumbleguys.com calls through our CORS proxy
    if(url.indexOf("api.stumbleguys.com")!==-1){
      var proxyUrl = "/api/sg-api?p=" + encodeURIComponent(url.replace("https://api.stumbleguys.com",""));
      return _fetch.call(this, proxyUrl, init);
    }
    return _fetch.apply(this, arguments);
  };
  console.log("[SG] API interceptor ready");
})();
