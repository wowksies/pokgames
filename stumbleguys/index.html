<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stumble Guys</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#0e1528;overflow:hidden}
    #container{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center}
    #unity-canvas{width:100%;height:100%;display:block}
    #loading{position:absolute;inset:0;background:#0e1528;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:#fff;z-index:10}
    #loading img{width:213px;height:120px}
    #progress-bar{width:480px;max-width:90vw;height:36px;border:2px solid #000;border-radius:8px;background:transparent;overflow:hidden;position:relative}
    #progress-fill{height:100%;background:linear-gradient(90deg,#f97316,#fb923c);border-radius:6px;transition:width .3s ease;width:0%}
    #progress-text{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#fde68a;font-weight:bold;font-size:14px}
    #error-msg{color:#f87171;text-align:center;max-width:500px;display:none;padding:0 20px;font-size:13px}
    #fs-btn{position:absolute;top:10px;right:10px;z-index:5;background:rgba(0,0,0,.5);border:none;border-radius:6px;padding:8px;cursor:pointer;display:none}
    #fs-btn svg{width:24px;height:24px;fill:white}
  </style>
</head>
<body>
<div id="container">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <img src="https://www.stumbleguys.com/images/loader/running-stumbler.gif" alt="Loading...">
    <div id="progress-bar"><div id="progress-fill"></div><span id="progress-text">0 %</span></div>
    <div id="error-msg"></div>
  </div>
  <button id="fs-btn" onclick="if(window.unityInstance)window.unityInstance.SetFullscreen(1)">
    <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
  </button>
</div>
<script>
// ── 1. Datadog mock ─────────────────────────────────────────────────────────
// Unity calls DD_LOGS.logger.* — must exist before Unity runs
(function(){
  var noop=function(){};
  var logger={log:noop,info:noop,warn:noop,error:noop,debug:noop};
  window.DD_LOGS={
    logger:logger,init:noop,
    addLoggerGlobalContext:noop,setLoggerGlobalContext:noop,
    createLogger:function(){return logger;},
    getLogger:function(){return logger;},
    onReady:function(cb){try{cb();}catch(e){}}
  };
  window.DD_RUM={
    init:noop,addRumGlobalContext:noop,setRumGlobalContext:noop,
    startView:noop,addAction:noop,addError:noop,
    onReady:function(cb){try{cb();}catch(e){}}
  };
})();

// ── 2. API interceptor (base64-encoded mocks — no escaping issues) ──────────
(function(){
  function d(b64){return atob(b64);}
  var MOCKS={
    'api.stumbleguys.com/bots':                         d(''),
    'api.stumbleguys.com/abilities':                    d(''),
    'api.stumbleguys.com/ranked/me':                    d(''),
    'api.stumbleguys.com/usersettings':                 d(''),
    'api.stumbleguys.com/playcount':                    d(''),
    'api.stumbleguys.com/social/interactions':          d(''),
    'api.stumbleguys.com/tournamentx/seasons':          d(''),
    'api.stumbleguys.com/tournamentx/active/v2':        d(''),
    'api.stumbleguys.com/missions':                     d(''),
    'api.stumbleguys.com/cosmetic-sources-config':      d(''),
    'api.stumbleguys.com/friends/blocked-users':        d(''),
    'api.stumbleguys.com/discoverability/interactions': d(''),
    'api.stumbleguys.com/collection-events/me':         d(''),
    'api.stumbleguys.com/clans/me':                     d('')
  };
  var FAKE_ME=JSON.stringify({id:'guest-0001',username:'Stumbler',avatar:'',level:1,coins:9999,gems:9999,crowns:99,trophies:0,isGuest:true,locale:'en',country:'US'});
  var OK='{}';var ARR='[]';
  function mock(body){return new Response(body||OK,{status:200,headers:{'Content-Type':'application/json','Access-Control-Allow-Origin':'*'}});}
  function find(url){
    for(var k in MOCKS){if(url.indexOf(k)!==-1)return MOCKS[k];}
    if(url.indexOf('api.stumbleguys.com')!==-1){
      if(url.indexOf('/me')!==-1||url.indexOf('/user')!==-1)return FAKE_ME;
      return OK;
    }
    if(url.indexOf('config.sdk.scopely.io')!==-1)return JSON.stringify({sdk_version:'4.0',features:{}});
    if(url.indexOf('static.aprod.scopely.io')!==-1)return OK;
    if(url.indexOf('localization2.stumbleguys.com')!==-1)return '';
    if(url.indexOf('devs-api.poki.com')!==-1)return OK;
    if(url.indexOf('hb.vntsm.com')!==-1)return OK;
    if(url.indexOf('bat.bing.com')!==-1)return OK;
    if(url.indexOf('payment-gateway')!==-1)return OK;
    if(url.indexOf('helpshift.com')!==-1)return OK;
    if(url.indexOf('usercentrics.eu')!==-1)return OK;
    if(url.indexOf('pusher.com')!==-1)return OK;
    return null;
  }
  var _fetch=window.fetch;
  window.fetch=function(input,init){
    var url=(typeof input==='string')?input:(input&&input.url)||'';
    var m=find(url);
    if(m!==null){console.log('[Mock fetch]',url.substring(0,80));return Promise.resolve(mock(m));}
    return _fetch.apply(this,arguments);
  };
  console.log('[SG] API interceptor ready');
})();

// ── 3. Venatus __VM mock — pre-game video ad completes instantly ─────────────
(function(){
  window.__VM={push:function(cb){setTimeout(function(){
    var E={RENDERED:'RENDERED',SLOT_VIDEO_AD_STARTED:'SLOT_VIDEO_AD_STARTED',SLOT_VIDEO_ALL_ADS_COMPLETE:'SLOT_VIDEO_ALL_ADS_COMPLETE',SLOT_VIDEO_AD_SKIPPED:'SLOT_VIDEO_AD_SKIPPED',SLOT_VIDEO_AD_ERROR:'SLOT_VIDEO_AD_ERROR'};
    var h={};var p={anyName:'video_2',on:function(e,f){h[e]=f;},off:function(e){delete h[e];}};
    cb({placements:[],removePlacement:function(){}},{Placement:{PLACEMENT_EVENTS:E},Config:{get:function(){return{activate:function(){return{videoApi:function(placeCb){
      placeCb(p);setTimeout(function(){if(h[E.SLOT_VIDEO_ALL_ADS_COMPLETE])h[E.SLOT_VIDEO_ALL_ADS_COMPLETE]();},200);
    }};}};}});
  },100);}};
  // In-game rewarded ads — instant reward
  window.showRewardedAd=window.ShowRewardedAd=function(cb){
    setTimeout(function(){
      if(window.unityInstance){
        ['AdsManager','AdManager','AdsController'].forEach(function(o){
          try{window.unityInstance.SendMessage(o,'OnRewardedAdComplete','1');}catch(e){}
          try{window.unityInstance.SendMessage(o,'OnRewardedAdFinished','true');}catch(e){}
        });
      }
      if(typeof cb==='function')cb(true);
    },300);
  };
  window.showAd=function(t,p,cb){setTimeout(function(){if(typeof cb==='function')cb({success:true});},300);};
  window.adBreak=function(o){if(o&&o.afterAd)setTimeout(o.afterAd,200);};
  window.adConfig=function(){};
  console.log('[SG] Ad mocks ready — all ads grant instant rewards');
})();
</script>

<script src="/stumbleguys/cdn/WebGL.loader.js"></script>
<script>
(function(){
  var canvas=document.getElementById('unity-canvas');
  var loading=document.getElementById('loading');
  var fill=document.getElementById('progress-fill');
  var text=document.getElementById('progress-text');
  var errDiv=document.getElementById('error-msg');

  createUnityInstance(canvas,{
    dataUrl:'/stumbleguys/cdn/WebGL.data.unityweb',
    frameworkUrl:'/stumbleguys/cdn/WebGL.framework.js.unityweb',
    codeUrl:'/stumbleguys/cdn/WebGL.wasm.unityweb',
    streamingAssetsUrl:'/stumbleguys/cdn/StreamingAssets',
    companyName:'Scopely',productName:'Stumble Guys',productVersion:'0.102',
    showBanner:function(msg,type){if(type==='error'){errDiv.textContent=msg;errDiv.style.display='block';}console.warn('[Unity]',msg);}
  },function(p){
    var pct=Math.round(p*100);
    fill.style.width=pct+'%';text.textContent=pct+' %';
  }).then(function(i){
    window.unityInstance=i;
    loading.style.display='none';
    document.getElementById('fs-btn').style.display='block';
    try{i.SendMessage('ScopelyId','SetUnityInstanceAvailable');}catch(e){}
    try{i.SendMessage('PusherManager','SetUnityInstanceAvailable');}catch(e){}
    console.log('[SG] Unity loaded!');
  }).catch(function(err){
    console.error('[Unity] Load failed:',err);
    errDiv.textContent='Load failed: '+(err.message||err);
    errDiv.style.display='block';
  });
})();
</script>
</body>
</html>
